# Genera el SVG de la serpiente y lo publica en la rama "output".
name: Generate Snake

on:
  # 3:37 y 15:37 UTC -> 10:37 p.m. y 10:37 a.m. en Chía.
  # Minuto no redondo a propósito: la cola de Actions se satura en el minuto 0.
  schedule:
    - cron: "37 3,15 * * *"
  workflow_dispatch:          # botón manual en la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
